name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: >-
    claude-${{ github.repository }}-${{
      github.event.issue.number ||
      github.event.pull_request.number ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  claude:
    name: Respond to trusted invocation
    if: |
      !endsWith(github.actor, '[bot]') &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required only for the trusted default-branch checkout.
      actions: read  # Required to inspect CI results.
      pull-requests: read  # Required to reject fork PR invocations before credential use.
      id-token: write  # Required to mint a short-lived Claude App token.
    steps:
      - name: Authorize invocation
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! permission="$(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" \
              --jq '.permission' 2>&1
          )"; then
            if [[ "$permission" == *"(HTTP 404)"* ]]; then
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Claude invocation skipped::${GITHUB_ACTOR} is not a repository collaborator."
              exit 0
            fi

            echo "::error title=Claude authorization failed::The collaborator-permission lookup failed."
            exit 1
          fi

          case "$permission" in
            admin|write)
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Claude invocation skipped::${GITHUB_ACTOR} does not have repository write access."
              exit 0
              ;;
          esac

          pr_number="$(
            jq -r '
              if (.pull_request? // null) != null then
                .pull_request.number
              elif (.issue?.pull_request? // null) != null then
                .issue.number
              else
                empty
              end
            ' "$GITHUB_EVENT_PATH"
          )"

          if [[ -n "$pr_number" ]]; then
            if ! head_repository="$(
              gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                --jq '.head.repo.full_name // empty' 2>&1
            )" || [[ -z "$head_repository" ]]; then
              echo "::error title=Claude authorization failed::The pull-request head lookup failed."
              exit 1
            fi

            if [[ "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Claude invocation skipped::Fork pull requests are reviewed manually."
              exit 0
            fi
          fi

          echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Require Claude credential
        if: steps.authorize.outputs.authorized == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error title=Claude credential unavailable::CLAUDE_CODE_OAUTH_TOKEN is required for trusted invocations."
            exit 1
          fi

      - name: Checkout repository
        if: steps.authorize.outputs.authorized == 'true'
        # Dependabot updates immutable pins and version comments. Review the
        # upstream release notes and commit diff before merging each update.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Run Claude Code
        if: steps.authorize.outputs.authorized == 'true'
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Preserve Claude App identity so branches and PRs created here can
          # trigger CI. The action exchanges OIDC for a short-lived token with
          # contents, pull-request, and issue write scopes plus this read scope.
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
