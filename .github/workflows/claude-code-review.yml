name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Review same-repository pull request
    # Forks and bot-authored PRs do not receive the Claude credential or a
    # write-capable token. Maintainer review remains available for those PRs.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read  # Required to inspect linked issue context.
      pull-requests: write  # Required to publish the requested review comment.

    steps:
      - name: Authorize reviewer
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! permission="$(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" \
              --jq '.permission' 2>&1
          )"; then
            if [[ "$permission" == *"(HTTP 404)"* ]]; then
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Claude review skipped::${GITHUB_ACTOR} is not a repository collaborator."
              exit 0
            fi

            echo "::error title=Claude authorization failed::The collaborator-permission lookup failed."
            exit 1
          fi

          case "$permission" in
            admin|write)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Claude review skipped::${GITHUB_ACTOR} does not have repository write access."
              ;;
          esac

      - name: Require Claude credential
        if: steps.authorize.outputs.authorized == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error title=Claude credential unavailable::CLAUDE_CODE_OAUTH_TOKEN is required for trusted same-repository reviews."
            exit 1
          fi

      - name: Checkout repository
        if: steps.authorize.outputs.authorized == 'true'
        # Dependabot updates immutable pins and version comments. Review the
        # upstream release notes and commit diff before merging each update.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run Claude Code Review
        if: steps.authorize.outputs.authorized == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the job token so the permissions above are the complete GitHub
          # authority; no OIDC/App-token exchange occurs.
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          # Repository inspection is read-only; only the explicit PR-comment
          # command receives write authority.
          claude_args: '--allowed-tools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
