---
name: HEAVY_DEBUG

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

concurrency:
  group: heavy-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  heavy-debug:
    name: Compile and test HEAVY_DEBUG
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Swift 6.3 toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun swift --version | grep -Eq 'Swift version 6\.3([.[:space:]]|$)'

      - name: Build HEAVY_DEBUG
        run: >-
          ./Scripts/run-without-warnings.sh swift build -c debug
          -Xswiftc -DHEAVY_DEBUG

      - name: Test HEAVY_DEBUG
        run: >-
          ./Scripts/run-without-warnings.sh swift test -c debug
          -Xswiftc -DHEAVY_DEBUG
