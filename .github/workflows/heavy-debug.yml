---
name: HEAVY_DEBUG

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  heavy-debug:
    name: Compile and test HEAVY_DEBUG
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Verify Swift 6.3 toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun swift --version | grep -Eq 'Swift version 6\.3([.[:space:]]|$)'

      - name: Build HEAVY_DEBUG
        run: swift build -c debug -q -Xswiftc -DHEAVY_DEBUG

      - name: Test HEAVY_DEBUG
        run: swift test -c debug -q -Xswiftc -DHEAVY_DEBUG
